name: Fix playback and library regressions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-player-regressions.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Apply regression fixes
        run: python3 scripts/apply_regression_fixes.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests, lint, and debug build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Commit validated fixes to main
        run: |
          rm -f .github/workflows/fix-player-regressions.yml scripts/apply_regression_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore playback, artwork, swipes, and track UI"
          git push origin HEAD:main
