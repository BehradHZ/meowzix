name: Apply Playlist Redesign

on:
  push:
    branches: [main]
    paths:
      - scripts/.playlist_redesign_apply.py
      - .github/workflows/apply-playlist-redesign.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[playlist-redesign-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply playlist redesign
        run: python scripts/.playlist_redesign_apply.py
      - name: Verify implementation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Commit verified implementation
        run: |
          rm -f scripts/.playlist_redesign_apply.py .github/workflows/apply-playlist-redesign.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign playlist experience [playlist-redesign-applied]'
          git push origin HEAD:main
