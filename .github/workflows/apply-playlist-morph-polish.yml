name: Apply Playlist Morph Polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-playlist-morph-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[playlist-morph-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply playlist morph polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/dev/behradhz/meowzix/feature/library/PlaylistExperience.kt')
          text = path.read_text()
          text = text.replace(
              'import androidx.compose.animation.core.animateDpAsState\n',
              'import androidx.compose.animation.animateContentSize\nimport androidx.compose.animation.core.animateDpAsState\n',
          )

          old = '''@Composable
          private fun PlaylistMorphCardV3(
              title: String,
              artworkRef: String?,
              favorite: Boolean,
              onClick: () -> Unit,
          ) {
              var opening by remember { mutableStateOf(false) }
              val artworkSize by animateDpAsState(if (opening) 86.dp else 72.dp, label = "playlist-card-morph")

              LaunchedEffect(opening) {
                  if (opening) {
                      delay(120)
                      onClick()
                      opening = false
                  }
              }

              Surface(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(enabled = !opening) { opening = true },
                  color = MaterialTheme.colorScheme.surface,
                  shape = RoundedCornerShape(if (opening) 26.dp else 20.dp),
                  tonalElevation = if (opening) 4.dp else 0.dp,
              ) {
                  Row(
                      modifier = Modifier.padding(horizontal = 8.dp, vertical = 8.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      PlaylistArtworkV3(
                          artworkRef = artworkRef,
                          title = title,
                          favorite = favorite,
                          size = artworkSize,
                      )
                      Spacer(Modifier.size(14.dp))
                      Text(
                          title,
                          modifier = Modifier.weight(1f),
                          style = MaterialTheme.typography.titleLarge,
                          fontWeight = FontWeight.SemiBold,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis,
                      )
                  }
              }
          }
          '''

          new = '''@Composable
          private fun PlaylistMorphCardV3(
              title: String,
              artworkRef: String?,
              favorite: Boolean,
              onClick: () -> Unit,
          ) {
              var opening by remember { mutableStateOf(false) }
              val artworkSize by animateDpAsState(
                  targetValue = if (opening) 176.dp else 72.dp,
                  label = "playlist-card-artwork-morph",
              )
              val cardPadding by animateDpAsState(
                  targetValue = if (opening) 18.dp else 8.dp,
                  label = "playlist-card-padding-morph",
              )

              LaunchedEffect(opening) {
                  if (opening) {
                      // Keep the source card alive long enough for its bounds, artwork, and title to
                      // visibly transform into the same visual hierarchy used by the detail hero.
                      delay(260)
                      onClick()
                      opening = false
                  }
              }

              Surface(
                  modifier = Modifier
                      .fillMaxWidth()
                      .animateContentSize()
                      .clickable(enabled = !opening) { opening = true },
                  color = MaterialTheme.colorScheme.surface,
                  shape = RoundedCornerShape(if (opening) 30.dp else 20.dp),
                  tonalElevation = if (opening) 6.dp else 0.dp,
              ) {
                  if (opening) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(cardPadding),
                          horizontalAlignment = Alignment.CenterHorizontally,
                      ) {
                          PlaylistArtworkV3(
                              artworkRef = artworkRef,
                              title = title,
                              favorite = favorite,
                              size = artworkSize,
                          )
                          Text(
                              title,
                              modifier = Modifier.padding(top = 14.dp),
                              style = MaterialTheme.typography.headlineSmall,
                              fontWeight = FontWeight.Bold,
                              textAlign = TextAlign.Center,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                          )
                      }
                  } else {
                      Row(
                          modifier = Modifier.padding(horizontal = cardPadding, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          PlaylistArtworkV3(
                              artworkRef = artworkRef,
                              title = title,
                              favorite = favorite,
                              size = artworkSize,
                          )
                          Spacer(Modifier.size(14.dp))
                          Text(
                              title,
                              modifier = Modifier.weight(1f),
                              style = MaterialTheme.typography.titleLarge,
                              fontWeight = FontWeight.SemiBold,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                          )
                      }
                  }
              }
          }
          '''

          if old not in text:
              raise SystemExit('PlaylistMorphCardV3 source block did not match; refusing unsafe patch')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify implementation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-playlist-morph-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish playlist morph transition [playlist-morph-applied]'
          git push origin HEAD:main
