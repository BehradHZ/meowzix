name: Release

on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      MEOWZIX_TELEGRAM_API_ID: ${{ secrets.MEOWZIX_TELEGRAM_API_ID }}
      MEOWZIX_TELEGRAM_API_HASH: ${{ secrets.MEOWZIX_TELEGRAM_API_HASH }}
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release credentials
        shell: bash
        run: |
          if [ -z "$MEOWZIX_TELEGRAM_API_ID" ] || [ -z "$MEOWZIX_TELEGRAM_API_HASH" ]; then
            echo "MEOWZIX_TELEGRAM_API_ID and MEOWZIX_TELEGRAM_API_HASH must be configured as GitHub Actions secrets before publishing." >&2
            exit 1
          fi

      - name: Skip an existing version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.existing.outputs.exists != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - if: steps.existing.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable GitHub APK
        if: steps.existing.outputs.exists != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release assets
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Meowzix-v${VERSION}.apk"
          (cd dist && sha256sum "Meowzix-v${VERSION}.apk" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          # Meowzix ${VERSION}

          First public GitHub build of Meowzix.

          Highlights:
          - Telegram music library with incremental sync
          - Local and Telegram artwork recovery
          - Interruption-free Play Next and Add to Queue
          - Swipe queue actions with mini-player confirmation
          - Offline downloads, queue, shuffle modes, history, and Telegram forwarding

          Download **Meowzix-v${VERSION}.apk** and install it on Android 8.0 or newer.
          SHA-256 verification is included in **SHA256SUMS.txt**.
          EOF

          gh release create "$TAG" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Meowzix ${VERSION}" \
            --notes-file release-notes.md \
            "dist/Meowzix-v${VERSION}.apk#Meowzix Android APK" \
            "dist/SHA256SUMS.txt#SHA-256 checksums"
