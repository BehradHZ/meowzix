name: Apply artwork and offline UX
on:
  push:
    branches: [feat/telegram-library-ux]
    paths: [.github/workflows/apply-meowzix-ui-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/telegram-library-ux
      - name: Apply
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'pattern missing: {path}: {old[:100]!r}')
              p.write_text(t.replace(old,new,1))
          def write(path, content):
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(content)

          art='app/src/main/java/dev/behradhz/meowzix/ui/components/TrackArtwork.kt'
          patch(art,'import androidx.compose.foundation.Image\nimport androidx.compose.foundation.background','import androidx.compose.foundation.Image\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable')
          patch(art,'import androidx.compose.material.icons.rounded.MusicNote','import androidx.compose.material.icons.rounded.Download\nimport androidx.compose.material.icons.rounded.MusicNote\nimport androidx.compose.material.icons.rounded.Person')
          patch(art,'import androidx.compose.material3.Icon\nimport androidx.compose.material3.MaterialTheme','import androidx.compose.material3.CircularProgressIndicator\nimport androidx.compose.material3.Icon\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.Surface')
          patch(art,'import androidx.compose.ui.unit.dp\nimport kotlinx.coroutines.Dispatchers','import androidx.compose.ui.unit.dp\nimport dev.behradhz.meowzix.domain.downloads.DownloadStatus\nimport dev.behradhz.meowzix.domain.downloads.OfflineDownload\nimport kotlinx.coroutines.Dispatchers')
          marker='''/**\n * Full-bleed artwork field used by Now Playing.'''
          addition='''@Composable\nfun ChatAvatar(\n    artworkRef: String?,\n    description: String,\n    size: Dp = 48.dp,\n    modifier: Modifier = Modifier,\n) {\n    val bitmap = rememberArtworkBitmap(artworkRef)\n    Box(\n        modifier = modifier.size(size).clip(MaterialTheme.shapes.extraLarge)\n            .background(MaterialTheme.colorScheme.secondaryContainer),\n        contentAlignment = Alignment.Center,\n    ) {\n        if (bitmap != null) {\n            Image(bitmap = bitmap, contentDescription = description, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop)\n        } else {\n            Icon(Icons.Rounded.Person, contentDescription = null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(size * 0.46f))\n        }\n    }\n}\n\n@Composable\nfun DownloadableTrackArtwork(\n    artworkRef: String?,\n    description: String,\n    size: Dp = 52.dp,\n    isOffline: Boolean,\n    download: OfflineDownload?,\n    onDownload: () -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    Box(modifier = modifier.size(size)) {\n        TrackArtwork(artworkRef, description, size = size)\n        if (!isOffline) {\n            val active = download?.status == DownloadStatus.DOWNLOADING || download?.status == DownloadStatus.QUEUED\n            if (active) {\n                Surface(\n                    modifier = Modifier.fillMaxSize(),\n                    shape = MaterialTheme.shapes.medium,\n                    color = Color.Black.copy(alpha = 0.36f),\n                ) {\n                    Box(contentAlignment = Alignment.Center) {\n                        val total = download?.totalBytes?.takeIf { it > 0L }\n                        if (total != null) {\n                            CircularProgressIndicator(\n                                progress = { (download.downloadedBytes.toFloat() / total).coerceIn(0f, 1f) },\n                                modifier = Modifier.size(size * 0.60f), strokeWidth = 3.dp, color = Color.White,\n                                trackColor = Color.White.copy(alpha = 0.24f),\n                            )\n                        } else {\n                            CircularProgressIndicator(\n                                modifier = Modifier.size(size * 0.60f), strokeWidth = 3.dp, color = Color.White,\n                                trackColor = Color.White.copy(alpha = 0.24f),\n                            )\n                        }\n                    }\n                }\n            } else {\n                Surface(\n                    modifier = Modifier.align(Alignment.BottomEnd).size(27.dp).clickable(onClick = onDownload),\n                    shape = MaterialTheme.shapes.extraLarge, color = Color.Black.copy(alpha = 0.70f), contentColor = Color.White,\n                ) {\n                    Box(contentAlignment = Alignment.Center) {\n                        Icon(Icons.Rounded.Download, contentDescription = "Download", modifier = Modifier.size(17.dp))\n                    }\n                }\n            }\n        }\n    }\n}\n\n'''
          patch(art,marker,addition+marker)

          picker='app/src/main/java/dev/behradhz/meowzix/feature/telegramauth/TelegramMusicSourcePicker.kt'
          patch(picker,'import dev.behradhz.meowzix.domain.telegram.TelegramMusicSourceState','import dev.behradhz.meowzix.domain.telegram.TelegramMusicSourceState\nimport dev.behradhz.meowzix.ui.components.ChatAvatar')
          patch(picker,'''                        Checkbox(\n                            checked = chat.selected,\n                            onCheckedChange = { checked -> onSetSelected(chat.chatId, checked) },\n                            enabled = enabled,\n                        )\n                        Column(modifier = Modifier.weight(1f).padding(start = 6.dp)) {''','''                        Checkbox(\n                            checked = chat.selected,\n                            onCheckedChange = { checked -> onSetSelected(chat.chatId, checked) },\n                            enabled = enabled,\n                        )\n                        ChatAvatar(chat.profilePhotoRef, chat.title, size = 44.dp)\n                        Column(modifier = Modifier.weight(1f).padding(start = 10.dp)) {''')

          write('app/src/main/java/dev/behradhz/meowzix/feature/downloads/DownloadsRoute.kt','''package dev.behradhz.meowzix.feature.downloads\n\nimport androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.PaddingValues\nimport androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.statusBarsPadding\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.rounded.DownloadForOffline\nimport androidx.compose.material3.Button\nimport androidx.compose.material3.Icon\nimport androidx.compose.material3.LinearProgressIndicator\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.OutlinedButton\nimport androidx.compose.material3.Surface\nimport androidx.compose.material3.Switch\nimport androidx.compose.material3.Text\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.unit.dp\nimport androidx.hilt.lifecycle.viewmodel.compose.hiltViewModel\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport dev.behradhz.meowzix.domain.downloads.DownloadStatus\nimport dev.behradhz.meowzix.domain.telegram.TelegramChatSummary\nimport dev.behradhz.meowzix.ui.components.ChatAvatar\nimport dev.behradhz.meowzix.ui.components.TrackArtwork\n\n@Composable\nfun DownloadsRoute(viewModel: DownloadsViewModel = hiltViewModel()) {\n    val rows by viewModel.rows.collectAsStateWithLifecycle()\n    val settings by viewModel.networkSettings.collectAsStateWithLifecycle()\n    val selectedChats by viewModel.selectedTelegramChats.collectAsStateWithLifecycle()\n    val active = rows.filter { it.status == DownloadStatus.DOWNLOADING || it.status == DownloadStatus.QUEUED }\n    val rest = rows.filterNot { it.status == DownloadStatus.DOWNLOADING || it.status == DownloadStatus.QUEUED }\n    LazyColumn(\n        modifier = Modifier.fillMaxSize().statusBarsPadding(),\n        contentPadding = PaddingValues(start = 18.dp, end = 18.dp, top = 18.dp, bottom = 182.dp),\n        verticalArrangement = Arrangement.spacedBy(12.dp),\n    ) {\n        item { Text("Offline", style = MaterialTheme.typography.headlineLarge, fontWeight = FontWeight.Bold) }\n        item { SettingToggle("Offline mode", settings.offlineMode, viewModel::setOfflineMode) }\n        item { SettingToggle("Wi-Fi only downloads", settings.wifiOnlyDownloads, viewModel::setWifiOnly) }\n        item { SettingToggle("Prefetch next track", settings.prefetchEnabled, viewModel::setPrefetch) }\n        item { SettingToggle("Prefetch on metered networks", settings.prefetchOnMetered, viewModel::setPrefetchOnMetered, enabled = settings.prefetchEnabled && !settings.wifiOnlyDownloads) }\n        if (selectedChats.isNotEmpty()) {\n            item { SectionTitle("Telegram sources") }\n            items(selectedChats, key = { it.chatId }) { chat ->\n                TelegramDownloadSource(chat) { viewModel.downloadAll(chat.chatId) }\n            }\n        }\n        if (active.isNotEmpty()) {\n            item { SectionTitle("Downloading now") }\n            items(active, key = { it.trackId }) { row -> DownloadRowCard(row, { viewModel.cancel(row.trackId) }, { viewModel.retry(row.trackId) }, { viewModel.remove(row.trackId) }) }\n        }\n        item { SectionTitle("Download library") }\n        if (rest.isEmpty() && active.isEmpty()) {\n            item { Text("Use the download icon on a track cover, or download a whole Telegram source above.", color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.62f)) }\n        } else {\n            items(rest, key = { it.trackId }) { row -> DownloadRowCard(row, { viewModel.cancel(row.trackId) }, { viewModel.retry(row.trackId) }, { viewModel.remove(row.trackId) }) }\n        }\n    }\n}\n\n@Composable\nprivate fun TelegramDownloadSource(chat: TelegramChatSummary, onDownloadAll: () -> Unit) {\n    Surface(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(22.dp), color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.52f)) {\n        Row(Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {\n            ChatAvatar(chat.profilePhotoRef, chat.title, size = 48.dp)\n            Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {\n                Text(chat.title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)\n                Text("Selected Telegram source", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.54f))\n            }\n            Button(onClick = onDownloadAll, shape = RoundedCornerShape(16.dp)) {\n                Icon(Icons.Rounded.DownloadForOffline, contentDescription = null, modifier = Modifier.size(18.dp))\n                Spacer(Modifier.size(6.dp)); Text("All")\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun DownloadRowCard(row: DownloadRow, onCancel: () -> Unit, onRetry: () -> Unit, onRemove: () -> Unit) {\n    Surface(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(20.dp), color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.38f)) {\n        Column(Modifier.padding(10.dp)) {\n            Row(verticalAlignment = Alignment.CenterVertically) {\n                TrackArtwork(row.artworkRef, row.title, size = 48.dp)\n                Column(Modifier.weight(1f).padding(start = 12.dp)) {\n                    Text(row.title, style = MaterialTheme.typography.titleSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)\n                    Text(row.status.label, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.58f))\n                }\n                when (row.status) {\n                    DownloadStatus.DOWNLOADING, DownloadStatus.QUEUED -> OutlinedButton(onClick = onCancel) { Text("Cancel") }\n                    DownloadStatus.FAILED, DownloadStatus.CANCELED -> Button(onClick = onRetry) { Text("Retry") }\n                    DownloadStatus.COMPLETED -> OutlinedButton(onClick = onRemove) { Text("Remove") }\n                }\n            }\n            if (row.status == DownloadStatus.DOWNLOADING || row.status == DownloadStatus.QUEUED) {\n                Spacer(Modifier.size(8.dp))\n                if (row.progress != null) LinearProgressIndicator(progress = { row.progress }, modifier = Modifier.fillMaxWidth()) else LinearProgressIndicator(modifier = Modifier.fillMaxWidth())\n            }\n            row.failureReason?.let { Text(it, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall) }\n        }\n    }\n}\n\n@Composable private fun SectionTitle(text: String) { Text(text, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp)) }\n@Composable private fun SettingToggle(label: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit, enabled: Boolean = true) {\n    Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) { Text(label, modifier = Modifier.weight(1f)); Switch(checked = checked, onCheckedChange = onCheckedChange, enabled = enabled) }\n}\nprivate val DownloadStatus.label: String get() = when (this) {\n    DownloadStatus.QUEUED -> "Queued"; DownloadStatus.DOWNLOADING -> "Downloading"; DownloadStatus.COMPLETED -> "Available offline"; DownloadStatus.FAILED -> "Download failed"; DownloadStatus.CANCELED -> "Canceled"\n}\n''')

          write('app/src/main/java/dev/behradhz/meowzix/MainActivity.kt','''package dev.behradhz.meowzix\n\nimport android.content.Intent\nimport android.os.Bundle\nimport androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent\nimport androidx.activity.enableEdgeToEdge\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.Surface\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.Modifier\nimport dagger.hilt.android.AndroidEntryPoint\nimport dev.behradhz.meowzix.navigation.MeowzixApp\nimport dev.behradhz.meowzix.ui.theme.MeowzixTheme\n\n@AndroidEntryPoint\nclass MainActivity : ComponentActivity() {\n    private var openNowPlaying by mutableStateOf(false)\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        openNowPlaying = intent?.action == ACTION_OPEN_NOW_PLAYING\n        enableEdgeToEdge()\n        setContent { MeowzixTheme { Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background, contentColor = MaterialTheme.colorScheme.onBackground) {\n            MeowzixApp(openNowPlayingRequest = openNowPlaying, onNowPlayingRequestConsumed = { openNowPlaying = false })\n        } } }\n    }\n    override fun onNewIntent(intent: Intent) { super.onNewIntent(intent); setIntent(intent); if (intent.action == ACTION_OPEN_NOW_PLAYING) openNowPlaying = true }\n    companion object { const val ACTION_OPEN_NOW_PLAYING = "dev.behradhz.meowzix.OPEN_NOW_PLAYING" }\n}\n''')
          app='app/src/main/java/dev/behradhz/meowzix/navigation/MeowzixApp.kt'
          patch(app,'''fun MeowzixApp(\n    playerViewModel: NowPlayingViewModel = hiltViewModel(),\n) {''','''fun MeowzixApp(\n    openNowPlayingRequest: Boolean = false,\n    onNowPlayingRequestConsumed: () -> Unit = {},\n    playerViewModel: NowPlayingViewModel = hiltViewModel(),\n) {''')
          patch(app,'''    val spectrum by playerViewModel.spectrum.collectAsStateWithLifecycle()\n\n    // Keep capture ownership''','''    val spectrum by playerViewModel.spectrum.collectAsStateWithLifecycle()\n\n    LaunchedEffect(openNowPlayingRequest) {\n        if (openNowPlayingRequest) {\n            navController.navigate(NOW_PLAYING_ROUTE) { launchSingleTop = true }\n            onNowPlayingRequestConsumed()\n        }\n    }\n\n    // Keep capture ownership''')

          for f in ['.github/workflows/apply-meowzix-ui-v2.yml','.github/workflows/apply-meowzix-ui.yml']:
              p=Path(f)
              if p.exists(): p.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): add source avatars and offline download UX"
          git push origin HEAD:feat/telegram-library-ux
