name: Release 0.4 Diagnostics

on:
  push:
    branches: ["release/0.4"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Capture build output
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace > release-0.4-diagnostics.txt 2>&1
          echo $? > release-0.4-exit-code.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: release-0.4-diagnostics
          path: |
            release-0.4-diagnostics.txt
            release-0.4-exit-code.txt
          if-no-files-found: error
