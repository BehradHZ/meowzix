name: Prepare queue and equalizer polish

on:
  push:
    branches:
      - automation/apply-waveform-main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build patch branch from current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp .github/scripts/apply_queue_equalizer_polish.py /tmp/apply_queue_equalizer_polish.py
          git checkout -B fix/queue-waveform-polish-20260924 origin/main
          python3 /tmp/apply_queue_equalizer_polish.py
          git add app/src/main/java/dev/behradhz/meowzix/feature/queue/QueueRoute.kt \
            app/src/main/java/dev/behradhz/meowzix/navigation/MeowzixApp.kt \
            app/src/main/java/dev/behradhz/meowzix/playback/AndroidPlaybackController.kt \
            app/src/main/java/dev/behradhz/meowzix/feature/nowplaying/NowPlayingRoute.kt \
            app/src/main/java/dev/behradhz/meowzix/ui/components/SyntheticWaveformSeekBar.kt
          git diff --cached --check
          git commit -m "fix(ui): polish queue reorder and equalizer seeking"
          git push --force origin fix/queue-waveform-polish-20260924
