          path.write_text(text)

          # Queue is a top-level tab; remove obsolete back callback at the navigation call site.
          path = Path('app/src/main/java/dev/behradhz/meowzix/navigation/MeowzixApp.kt')
          text = path.read_text()
          text, count = re.subn(
              r'QueueRoute\(\s*onBack\s*=\s*navController::popBackStack\s*\)',
