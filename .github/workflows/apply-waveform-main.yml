name: Prepare queue and equalizer polish

on:
  push:
    branches:
      - automation/apply-waveform-main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build patch branch from current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B fix/queue-waveform-polish-20260924 origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          # --- Queue UI: pinned header, no back action, drag handle owns long-press. ---
          path = Path('app/src/main/java/dev/behradhz/meowzix/feature/queue/QueueRoute.kt')
