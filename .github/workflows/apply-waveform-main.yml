          text = text.replace('@Composable\nprivate fun QueueScreen(', '@OptIn(ExperimentalFoundationApi::class)\n@Composable\nprivate fun QueueScreen(', 1)

          lazy_anchor = text.index('    LazyColumn(')
          header_start = text.index('        item {\n            Row(', lazy_anchor)
          header_end = text.index('\n\n        if (displayItems.isEmpty())', header_start)
          pinned_header = '''        stickyHeader {
            Surface(
                modifier = Modifier.fillMaxWidth(),
