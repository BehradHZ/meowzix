name: Apply waveform UI to main

on:
  push:
    branches:
      - automation/apply-waveform-main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply waveform patch onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main ui
          git checkout main
          git reset --hard origin/main
          git show origin/ui:app/src/main/java/dev/behradhz/meowzix/ui/components/SyntheticWaveformSeekBar.kt > app/src/main/java/dev/behradhz/meowzix/ui/components/SyntheticWaveformSeekBar.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/dev/behradhz/meowzix/feature/nowplaying/NowPlayingRoute.kt')
          text = path.read_text()

          for line in [
              'import android.Manifest\n',
              'import android.content.pm.PackageManager\n',
              'import androidx.activity.compose.rememberLauncherForActivityResult\n',
              'import androidx.activity.result.contract.ActivityResultContracts\n',
              'import androidx.compose.material3.CircularProgressIndicator\n',
              'import androidx.compose.ui.platform.LocalContext\n',
              'import androidx.core.content.ContextCompat\n',
              'import dev.behradhz.meowzix.domain.playback.AudioSpectrumState\n',
              'import dev.behradhz.meowzix.ui.components.AudioSpectrum\n',
              'import dev.behradhz.meowzix.ui.components.CurlyMusicSlider\n',
              'import kotlinx.coroutines.delay\n',
          ]:
              text = text.replace(line, '')

          anchor = 'import dev.behradhz.meowzix.ui.components.GlassSurface\n'
          text = text.replace(anchor, anchor + 'import dev.behradhz.meowzix.ui.components.SyntheticWaveformSeekBar\n')
          text = text.replace(
              'private val PlayerGlass = Color(0xFF171615)\n',
              'private val PlayerGlass = Color(0xFF171615)\nprivate val PlayerLoadingShimmer = Color(0xFFFF4D4D)\n',
          )
          text = text.replace('    val spectrum by viewModel.spectrum.collectAsStateWithLifecycle()\n', '')

          permission_block = (
              '    val context = LocalContext.current\n'
              '    val visualizerPermissionLauncher = rememberLauncherForActivityResult(\n'
              '        contract = ActivityResultContracts.RequestPermission(),\n'
              '        onResult = { granted ->\n'
              '            if (granted) viewModel.refreshVisualizer()\n'
              '        },\n'
              '    )\n\n'
              '    LaunchedEffect(Unit) {\n'
              '        if (\n'
              '            ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) ==\n'
              '            PackageManager.PERMISSION_GRANTED\n'
              '        ) {\n'
              '            viewModel.refreshVisualizer()\n'
              '        } else {\n'
              '            visualizerPermissionLauncher.launch(Manifest.permission.RECORD_AUDIO)\n'
              '        }\n'
              '    }\n\n'
          )
          if permission_block not in text:
              raise SystemExit('Permission block changed unexpectedly')
          text = text.replace(permission_block, '', 1)
          text = text.replace('        spectrum = spectrum,\n', '')
          text = text.replace('    spectrum: AudioSpectrumState,\n', '')

          loading_block = (
              '    val playbackLoading =\n'
              '        state.status == PlaybackStatus.DOWNLOADING ||\n'
              '            state.status == PlaybackStatus.BUFFERING ||\n'
              '            state.status == PlaybackStatus.PREPARING\n'
              '    var showPlaybackLoading by remember { mutableStateOf(false) }\n\n'
              '    // Media3 can report BUFFERING/PREPARING for only a few frames while moving between already\n'
              '    // prefetched queue items. Avoid flashing a full-screen spinner for those normal transitions;\n'
              '    // keep it for stalls that are long enough for the user to actually be waiting.\n'
              '    LaunchedEffect(playbackLoading) {\n'
              '        if (!playbackLoading) {\n'
              '            showPlaybackLoading = false\n'
              '            return@LaunchedEffect\n'
              '        }\n'
              '        showPlaybackLoading = false\n'
              '        delay(450L)\n'
              '        showPlaybackLoading = true\n'
              '    }\n\n'
          )
          if loading_block not in text:
              raise SystemExit('Loading block changed unexpectedly')
          text = text.replace(
              loading_block,
              '    val isLoading =\n'
              '        state.status == PlaybackStatus.DOWNLOADING ||\n'
              '            state.status == PlaybackStatus.BUFFERING ||\n'
              '            state.status == PlaybackStatus.PREPARING\n\n',
              1,
          )

          seek_block = re.compile(
              r'            FileWaveform\([\s\S]*?'
              r'            CurlyMusicSlider\([\s\S]*?'
              r'                modifier = Modifier\.fillMaxWidth\(\),\n'
              r'            \)\n'
          )
          seek_replacement = (
              '            SyntheticWaveformSeekBar(\n'
              '                trackKey = track.id.toString(),\n'
              '                value = shownPosition.toFloat(),\n'
              '                onValueChange = { pendingSeek = it },\n'
              '                onValueChangeFinished = {\n'
              '                    pendingSeek?.let { onSeek(it.toLong()) }\n'
              '                    pendingSeek = null\n'
              '                },\n'
              '                valueRange = 0f..duration.toFloat(),\n'
              '                enabled = state.durationMs > 0L && !isLoading,\n'
              '                isPlaying = state.status == PlaybackStatus.PLAYING,\n'
              '                isLoading = isLoading,\n'
              '                activeBarColor = MaterialTheme.colorScheme.primary,\n'
              '                inactiveBarColor = PlayerPrimaryContent.copy(alpha = 0.24f),\n'
              '                pointerColor = PlayerPrimaryContent,\n'
              '                loadingShimmerColor = PlayerLoadingShimmer,\n'
              '                modifier = Modifier.fillMaxWidth(),\n'
              '            )\n'
          )
          text, n = seek_block.subn(seek_replacement, text, count=1)
          if n != 1:
              raise SystemExit('Failed to replace waveform/seekbar block')

          spinner_block = re.compile(
              r'\n        if \(showPlaybackLoading && playbackLoading\) \{[\s\S]*?\n        }\n\n        state\.errorMessage'
          )
          text, n = spinner_block.subn('\n        state.errorMessage', text, count=1)
          if n != 1:
              raise SystemExit('Failed to remove full-screen loading spinner')

          file_waveform = re.compile(
              r'\n@Composable\nprivate fun FileWaveform\([\s\S]*?\n}\n\n@Composable\nprivate fun PlayerHeader'
          )
          text, n = file_waveform.subn('\n@Composable\nprivate fun PlayerHeader', text, count=1)
          if n != 1:
              raise SystemExit('Failed to remove legacy FileWaveform composable')

          path.write_text(text)
          PY

          git add app/src/main/java/dev/behradhz/meowzix/feature/nowplaying/NowPlayingRoute.kt app/src/main/java/dev/behradhz/meowzix/ui/components/SyntheticWaveformSeekBar.kt
          git diff --cached --check
          git commit -m "feat(ui): replace player seekbar with loading waveform"
          git push origin main
