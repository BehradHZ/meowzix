name: Fix compile regressions and validate

on:
  push:
    branches:
      - feat/telegram-library-ux
    paths:
      - .github/workflows/fix-compile-and-validate.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/telegram-library-ux

      - name: Fix compile regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('app/src/main/java/dev/behradhz/meowzix/feature/library/LibraryRoute.kt')
          text = lib.read_text()
          old = '''                        onPinOffline = onPinOffline,
                        availability = state.availability,
                        playlists = state.playlists,
                        onFavorite = onFavorite,
'''
          new = '''                        onPinOffline = onPinOffline,
                        availability = state.availability,
                        downloads = state.downloads,
                        playlists = state.playlists,
                        onFavorite = onFavorite,
'''
          if old not in text:
              raise SystemExit('Favorites TracksSection call not found')
          lib.write_text(text.replace(old, new, 1))

          app = Path('app/src/main/java/dev/behradhz/meowzix/navigation/MeowzixApp.kt')
          text = app.read_text()
          if 'import androidx.compose.runtime.LaunchedEffect\n' not in text:
              marker = 'import androidx.compose.runtime.Composable\n'
              if marker not in text:
                  raise SystemExit('Composable import marker not found')
              text = text.replace(marker, marker + 'import androidx.compose.runtime.LaunchedEffect\n', 1)
          app.write_text(text)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests, lint, and debug build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-compile-and-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve Telegram UX branch compile regressions"
          git push origin HEAD:feat/telegram-library-ux
