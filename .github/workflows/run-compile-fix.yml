name: Run compile regression patch

on:
  push:
    branches: [feat/telegram-library-ux]
    paths: [.github/workflows/run-compile-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/telegram-library-ux
      - name: Apply compile fixes
        run: python3 .github/scripts/fix_compile.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Commit fixes
        run: |
          rm -f .github/scripts/fix_compile.py
          rm -f .github/workflows/run-compile-fix.yml
          rm -f .github/workflows/fix-compile-and-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve compile regressions after Telegram UX update"
          git push origin HEAD:feat/telegram-library-ux
