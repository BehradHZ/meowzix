name: Apply Meowzix core UX changes

on:
  push:
    branches: [feat/telegram-library-ux]
    paths: [.github/workflows/apply-meowzix-core.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/telegram-library-ux
      - name: Apply core changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)

          # Telegram domain: chat artwork, imported-track lookup, stable Telegram playlist ids.
          patch(
              'app/src/main/java/dev/behradhz/meowzix/domain/telegram/TelegramRepository.kt',
              '''data class TelegramChatSummary(\n    val chatId: Long,\n    val title: String,\n    val kind: TelegramChatKind,\n    val selected: Boolean,\n)''',
              '''data class TelegramChatSummary(\n    val chatId: Long,\n    val title: String,\n    val kind: TelegramChatKind,\n    val selected: Boolean,\n    val profilePhotoRef: String? = null,\n)'''
          )
          patch(
              'app/src/main/java/dev/behradhz/meowzix/domain/telegram/TelegramRepository.kt',
              '''    fun syncSelectedSources()\n    fun clearMusicSourceError()\n}''',
              '''    fun syncSelectedSources()\n    suspend fun trackIdsForChat(chatId: Long): List<java.util.UUID>\n    fun clearMusicSourceError()\n}\n\nfun telegramPlaylistId(accountId: String, chatId: Long): java.util.UUID =\n    java.util.UUID.nameUUIDFromBytes("telegram-playlist:$accountId:$chatId".toByteArray())'''
          )

          # Telegram repository: preserve imported songs on deselection, maintain one playlist per source,
          # and fetch small chat avatars for source selection / playlist artwork.
          tg = 'app/src/main/java/dev/behradhz/meowzix/data/telegram/TdLibTelegramRepository.kt'
          patch(tg, 'import android.content.Context\nimport android.os.Build', 'import android.content.Context\nimport android.net.Uri\nimport android.os.Build')
          patch(tg, 'import dev.behradhz.meowzix.data.db.MeowzixDatabase\nimport dev.behradhz.meowzix.data.db.TelegramDao', 'import dev.behradhz.meowzix.data.db.MeowzixDatabase\nimport dev.behradhz.meowzix.data.db.PlaylistDao\nimport dev.behradhz.meowzix.data.db.PlaylistEntity\nimport dev.behradhz.meowzix.data.db.PlaylistTrackEntity\nimport dev.behradhz.meowzix.data.db.TelegramDao')
          patch(tg, 'import dev.behradhz.meowzix.domain.telegram.TelegramSyncResult', 'import dev.behradhz.meowzix.domain.telegram.TelegramSyncResult\nimport dev.behradhz.meowzix.domain.telegram.telegramPlaylistId')
          patch(tg, '''    private val libraryDao: LibraryDao,\n    private val telegramDao: TelegramDao,\n) : TelegramRepository''', '''    private val libraryDao: LibraryDao,\n    private val telegramDao: TelegramDao,\n    private val playlistDao: PlaylistDao,\n) : TelegramRepository''')
          patch(tg, '''                chatIds.mapNotNull { chatId ->\n                    runCatching { activeClient.send(TdApi.GetChat(chatId)) }.getOrNull()\n                }.map { chat -> chat.toSummary(userId, chat.id in selectedIds) }\n                    .sortedWith(compareByDescending<TelegramChatSummary> { it.kind == TelegramChatKind.SAVED_MESSAGES }.thenBy { it.title.lowercase(Locale.ROOT) })''', '''                chatIds.mapNotNull { chatId ->\n                    runCatching { activeClient.send(TdApi.GetChat(chatId)) }.getOrNull()\n                }.map { chat ->\n                    chat.toSummary(\n                        currentUserId = userId,\n                        selected = chat.id in selectedIds,\n                        profilePhotoRef = resolveChatPhotoRef(activeClient, chat),\n                    )\n                }.sortedWith(compareByDescending<TelegramChatSummary> { it.kind == TelegramChatKind.SAVED_MESSAGES }.thenBy { it.title.lowercase(Locale.ROOT) })''')
          patch(tg, '''                    telegramDao.upsertSelectedSource(\n                        TelegramSelectedSourceEntity(\n                            accountId = accountId,\n                            chatId = chatId,\n                            title = chat.title,\n                            kind = chat.kind.name,\n                            newestMessageId = existing?.newestMessageId,\n                            initialScanComplete = existing?.initialScanComplete ?: false,\n                            lastSyncedAtEpochMs = existing?.lastSyncedAtEpochMs,\n                        ),\n                    )\n                } else {\n                    telegramDao.deleteSelectedSource(accountId, chatId)\n                    val now = Instant.now().toEpochMilli()\n                    val sourceIds = telegramDao.telegramSourcesForChat(accountId, chatId).map { it.trackSourceId }\n                    if (sourceIds.isNotEmpty()) libraryDao.updateAvailability(sourceIds, SourceAvailability.MISSING, now)\n                }''', '''                    telegramDao.upsertSelectedSource(\n                        TelegramSelectedSourceEntity(\n                            accountId = accountId,\n                            chatId = chatId,\n                            title = chat.title,\n                            kind = chat.kind.name,\n                            newestMessageId = existing?.newestMessageId,\n                            initialScanComplete = existing?.initialScanComplete ?: false,\n                            lastSyncedAtEpochMs = existing?.lastSyncedAtEpochMs,\n                        ),\n                    )\n                    ensureChatPlaylist(accountId, chatId, chat.title)\n                } else {\n                    // Selection controls future syncing only. Imported tracks and their remote source\n                    // stay in the library and the generated chat playlist is intentionally retained.\n                    telegramDao.deleteSelectedSource(accountId, chatId)\n                }''')
          patch(tg, '''            if (imported != null) reloadPersistedSelection(accountId)\n        }\n    }''', '''            if (imported != null) {\n                val title = selected.title\n                syncChatPlaylist(accountId, message.chatId, title)\n                reloadPersistedSelection(accountId)\n            }\n        }\n    }''')
          patch(tg, '''            runCatching { activeClient.send(TdApi.GetMessage(chatId, messageId)) }\n                .onSuccess { persistTelegramMessage(accountId, it) }\n        }\n    }''', '''            runCatching { activeClient.send(TdApi.GetMessage(chatId, messageId)) }\n                .onSuccess {\n                    persistTelegramMessage(accountId, it)\n                    telegramDao.selectedSource(accountId, chatId)?.let { selected ->\n                        syncChatPlaylist(accountId, chatId, selected.title)\n                    }\n                }\n        }\n    }''')
          patch(tg, '''            val ids = telegramDao.trackSourceIdsForMessages(accountId, update.chatId, update.messageIds.toList())\n            if (ids.isNotEmpty()) libraryDao.updateAvailability(ids, SourceAvailability.MISSING, Instant.now().toEpochMilli())\n        }\n    }''', '''            val ids = telegramDao.trackSourceIdsForMessages(accountId, update.chatId, update.messageIds.toList())\n            if (ids.isNotEmpty()) libraryDao.updateAvailability(ids, SourceAvailability.MISSING, Instant.now().toEpochMilli())\n            telegramDao.selectedSource(accountId, update.chatId)?.let { selected ->\n                syncChatPlaylist(accountId, update.chatId, selected.title)\n            }\n        }\n    }''')
          patch(tg, '''        telegramDao.updateSyncCheckpoint(\n            accountId = accountId,\n            chatId = selected.chatId,\n            newestMessageId = newestScanned.takeIf { it > 0L },\n            initialScanComplete = true,\n            syncedAt = Instant.now().toEpochMilli(),\n        )\n        return result\n    }''', '''        telegramDao.updateSyncCheckpoint(\n            accountId = accountId,\n            chatId = selected.chatId,\n            newestMessageId = newestScanned.takeIf { it > 0L },\n            initialScanComplete = true,\n            syncedAt = Instant.now().toEpochMilli(),\n        )\n        syncChatPlaylist(accountId, selected.chatId, selected.title)\n        return result\n    }''')
          patch(tg, '''    private suspend fun findMatchingTrack(incoming: IncomingTrackIdentity): String? {''', '''    override suspend fun trackIdsForChat(chatId: Long): List<UUID> {\n        val accountId = currentUserId?.toString() ?: _musicSourceState.value.accountId ?: return emptyList()\n        return telegramDao.telegramSourcesForChat(accountId, chatId)\n            .mapNotNull { source ->\n                libraryDao.sourceById(source.trackSourceId)\n                    ?.takeUnless { it.availability == SourceAvailability.MISSING }\n                    ?.trackId\n                    ?.let { runCatching { UUID.fromString(it) }.getOrNull() }\n            }\n            .distinct()\n    }\n\n    private suspend fun ensureChatPlaylist(accountId: String, chatId: Long, title: String) {\n        val now = Instant.now().toEpochMilli()\n        playlistDao.upsertPlaylist(\n            PlaylistEntity(\n                id = telegramPlaylistId(accountId, chatId).toString(),\n                title = title.ifBlank { "Telegram" },\n                createdAtEpochMs = now,\n                updatedAtEpochMs = now,\n            ),\n        )\n    }\n\n    private suspend fun syncChatPlaylist(accountId: String, chatId: Long, title: String) {\n        ensureChatPlaylist(accountId, chatId, title)\n        val playlistId = telegramPlaylistId(accountId, chatId).toString()\n        val now = Instant.now().toEpochMilli()\n        val trackIds = telegramDao.telegramSourcesForChat(accountId, chatId)\n            .mapNotNull { source ->\n                libraryDao.sourceById(source.trackSourceId)\n                    ?.takeUnless { it.availability == SourceAvailability.MISSING }\n                    ?.trackId\n            }\n            .distinct()\n        playlistDao.clearTracks(playlistId)\n        if (trackIds.isNotEmpty()) {\n            playlistDao.upsertTracks(\n                trackIds.mapIndexed { index, trackId ->\n                    PlaylistTrackEntity(playlistId, trackId, index, now)\n                },\n            )\n        }\n    }\n\n    private suspend fun resolveChatPhotoRef(activeClient: TdLibClientAdapter, chat: TdApi.Chat): String? {\n        val photo = chat.photo?.small ?: return null\n        val resolved = if (photo.local.isDownloadingCompleted && photo.local.path.isNotBlank()) {\n            photo\n        } else {\n            runCatching { activeClient.send(TdApi.DownloadFile(photo.id, CHAT_PHOTO_PRIORITY, 0L, 0L, true)) }.getOrNull()\n        } ?: return null\n        val path = resolved.local.path.takeIf(String::isNotBlank) ?: return null\n        return File(path).takeIf(File::isFile)?.let { Uri.fromFile(it).toString() }\n    }\n\n    private suspend fun findMatchingTrack(incoming: IncomingTrackIdentity): String? {''')
          patch(tg, '''    private fun safeMessage(error: Throwable): String = error.message?.takeIf(String::isNotBlank) ?: "Telegram request failed."\n}''', '''    private fun safeMessage(error: Throwable): String = error.message?.takeIf(String::isNotBlank) ?: "Telegram request failed."\n\n    private companion object {\n        const val CHAT_PHOTO_PRIORITY = 2\n    }\n}''')
          patch(tg, '''private fun TdApi.Chat.toSummary(currentUserId: Long, selected: Boolean): TelegramChatSummary {''', '''private fun TdApi.Chat.toSummary(\n    currentUserId: Long,\n    selected: Boolean,\n    profilePhotoRef: String?,\n): TelegramChatSummary {''')
          patch(tg, '''    return TelegramChatSummary(id, title.ifBlank { "Untitled chat" }, kind, selected)''', '''    return TelegramChatSummary(\n        chatId = id,\n        title = title.ifBlank { "Untitled chat" },\n        kind = kind,\n        selected = selected,\n        profilePhotoRef = profilePhotoRef,\n    )''')

          # Library state observes per-track download progress and Telegram playlist artwork.
          vm = 'app/src/main/java/dev/behradhz/meowzix/feature/library/LibraryViewModel.kt'
          patch(vm, 'import dev.behradhz.meowzix.domain.downloads.DownloadRepository', 'import dev.behradhz.meowzix.domain.downloads.DownloadRepository\nimport dev.behradhz.meowzix.domain.downloads.OfflineDownload')
          patch(vm, 'import dev.behradhz.meowzix.domain.playback.QueueRepository', 'import dev.behradhz.meowzix.domain.playback.QueueRepository\nimport dev.behradhz.meowzix.domain.telegram.TelegramRepository\nimport dev.behradhz.meowzix.domain.telegram.telegramPlaylistId')
          patch(vm, '''    val availability: Map<UUID, LibraryTrackAvailability> = emptyMap(),\n    val playlists: List<PlaylistSummary> = emptyList(),''', '''    val availability: Map<UUID, LibraryTrackAvailability> = emptyMap(),\n    val downloads: Map<UUID, OfflineDownload> = emptyMap(),\n    val playlists: List<PlaylistSummary> = emptyList(),\n    val playlistArtwork: Map<UUID, String?> = emptyMap(),''')
          patch(vm, '''    private val downloadRepository: DownloadRepository,\n    private val playlistRepository: PlaylistRepository,\n) : ViewModel()''', '''    private val downloadRepository: DownloadRepository,\n    private val playlistRepository: PlaylistRepository,\n    private val telegramRepository: TelegramRepository,\n) : ViewModel()''')
          patch(vm, '''        viewModelScope.launch {\n            playlistRepository.observePlaylists().collect { playlists ->\n                _state.update { it.copy(playlists = playlists) }\n            }\n        }''', '''        viewModelScope.launch {\n            playlistRepository.observePlaylists().collect { playlists ->\n                _state.update { it.copy(playlists = playlists) }\n            }\n        }\n        viewModelScope.launch {\n            downloadRepository.observeDownloads().collect { downloads ->\n                _state.update { it.copy(downloads = downloads.associateBy(OfflineDownload::trackId)) }\n            }\n        }\n        viewModelScope.launch {\n            telegramRepository.musicSourceState.collect { telegram ->\n                val accountId = telegram.accountId\n                val artwork = if (accountId == null) emptyMap() else telegram.chats.associate { chat ->\n                    telegramPlaylistId(accountId, chat.chatId) to chat.profilePhotoRef\n                }\n                _state.update { it.copy(playlistArtwork = artwork) }\n            }\n        }''')

          # Queue ViewModel gains the actions required by queue gestures/long-press plus download state.
          write('app/src/main/java/dev/behradhz/meowzix/feature/queue/QueueViewModel.kt', '''package dev.behradhz.meowzix.feature.queue\n\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport dagger.hilt.android.lifecycle.HiltViewModel\nimport dev.behradhz.meowzix.core.model.Track\nimport dev.behradhz.meowzix.domain.downloads.DownloadRepository\nimport dev.behradhz.meowzix.domain.downloads.OfflineDownload\nimport dev.behradhz.meowzix.domain.library.LibraryTrackAvailability\nimport dev.behradhz.meowzix.domain.library.MusicLibraryRepository\nimport dev.behradhz.meowzix.domain.library.PlaylistRepository\nimport dev.behradhz.meowzix.domain.library.PlaylistSummary\nimport dev.behradhz.meowzix.domain.playback.QueueRepository\nimport java.util.UUID\nimport javax.inject.Inject\nimport kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.flow.update\nimport kotlinx.coroutines.launch\n\ndata class QueueAuxState(\n    val tracks: Map<UUID, Track> = emptyMap(),\n    val availability: Map<UUID, LibraryTrackAvailability> = emptyMap(),\n    val downloads: Map<UUID, OfflineDownload> = emptyMap(),\n    val playlists: List<PlaylistSummary> = emptyList(),\n)\n\n@HiltViewModel\nclass QueueViewModel @Inject constructor(\n    private val queueRepository: QueueRepository,\n    private val libraryRepository: MusicLibraryRepository,\n    private val downloads: DownloadRepository,\n    private val playlists: PlaylistRepository,\n) : ViewModel() {\n    val state = queueRepository.queueState\n    private val _aux = MutableStateFlow(QueueAuxState())\n    val aux: StateFlow<QueueAuxState> = _aux.asStateFlow()\n\n    init {\n        viewModelScope.launch {\n            libraryRepository.observeLibraryTracks().collect { rows ->\n                _aux.update { current ->\n                    current.copy(\n                        tracks = rows.associate { it.track.id to it.track },\n                        availability = rows.associate { it.track.id to it.availability },\n                    )\n                }\n            }\n        }\n        viewModelScope.launch {\n            downloads.observeDownloads().collect { rows ->\n                _aux.update { it.copy(downloads = rows.associateBy(OfflineDownload::trackId)) }\n            }\n        }\n        viewModelScope.launch {\n            playlists.observePlaylists().collect { rows -> _aux.update { it.copy(playlists = rows) } }\n        }\n    }\n\n    fun moveUp(index: Int) = queueRepository.move(index, index - 1)\n    fun moveDown(index: Int) = queueRepository.move(index, index + 1)\n    fun remove(index: Int) = queueRepository.removeAt(index)\n    fun clear() = queueRepository.clear()\n    fun playNext(trackId: UUID) = queueRepository.playNext(trackId)\n    fun addToQueue(trackId: UUID) = queueRepository.addToQueue(trackId)\n    fun pinOffline(trackId: UUID) = downloads.pinOffline(trackId)\n    fun toggleFavorite(trackId: UUID) {\n        val track = _aux.value.tracks[trackId] ?: return\n        viewModelScope.launch { libraryRepository.setFavorite(trackId, !track.favorite) }\n    }\n    fun addToPlaylist(trackId: UUID, playlistId: UUID) = viewModelScope.launch {\n        playlists.addTrack(playlistId, trackId)\n    }\n}\n''')

          # Offline ViewModel: expose selected Telegram source groups and bulk download actions.
          write('app/src/main/java/dev/behradhz/meowzix/feature/downloads/DownloadsViewModel.kt', '''package dev.behradhz.meowzix.feature.downloads\n\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport dagger.hilt.android.lifecycle.HiltViewModel\nimport dev.behradhz.meowzix.domain.downloads.DownloadRepository\nimport dev.behradhz.meowzix.domain.downloads.DownloadStatus\nimport dev.behradhz.meowzix.domain.library.MusicLibraryRepository\nimport dev.behradhz.meowzix.domain.settings.SettingsRepository\nimport dev.behradhz.meowzix.domain.telegram.TelegramChatSummary\nimport dev.behradhz.meowzix.domain.telegram.TelegramRepository\nimport java.util.UUID\nimport javax.inject.Inject\nimport kotlinx.coroutines.flow.SharingStarted\nimport kotlinx.coroutines.flow.combine\nimport kotlinx.coroutines.flow.map\nimport kotlinx.coroutines.flow.stateIn\nimport kotlinx.coroutines.launch\n\ndata class DownloadRow(\n    val trackId: UUID,\n    val title: String,\n    val artworkRef: String?,\n    val status: DownloadStatus,\n    val progress: Float?,\n    val downloadedBytes: Long,\n    val totalBytes: Long?,\n    val failureReason: String?,\n)\n\n@HiltViewModel\nclass DownloadsViewModel @Inject constructor(\n    private val downloads: DownloadRepository,\n    library: MusicLibraryRepository,\n    private val settings: SettingsRepository,\n    private val telegram: TelegramRepository,\n) : ViewModel() {\n    val rows = combine(downloads.observeDownloads(), library.observeTracks()) { records, tracks ->\n        val byId = tracks.associateBy { it.id }\n        records.map { record ->\n            val track = byId[record.trackId]\n            DownloadRow(\n                trackId = record.trackId,\n                title = track?.title ?: "Unknown track",\n                artworkRef = track?.artworkRef,\n                status = record.status,\n                progress = record.totalBytes?.takeIf { it > 0L }?.let {\n                    (record.downloadedBytes.toFloat() / it).coerceIn(0f, 1f)\n                },\n                downloadedBytes = record.downloadedBytes,\n                totalBytes = record.totalBytes,\n                failureReason = record.failureReason,\n            )\n        }\n    }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())\n\n    val selectedTelegramChats = telegram.musicSourceState\n        .map { state -> state.chats.filter(TelegramChatSummary::selected) }\n        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())\n\n    val networkSettings = settings.networkPlaybackSettings\n        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), dev.behradhz.meowzix.domain.settings.NetworkPlaybackSettings())\n\n    fun downloadAll(chatId: Long) = viewModelScope.launch {\n        telegram.trackIdsForChat(chatId).forEach(downloads::pinOffline)\n    }\n    fun retry(trackId: UUID) = downloads.retry(trackId)\n    fun cancel(trackId: UUID) = downloads.cancel(trackId)\n    fun remove(trackId: UUID) = viewModelScope.launch { downloads.removeOfflineCopy(trackId) }\n    fun setOfflineMode(enabled: Boolean) = viewModelScope.launch { settings.setOfflineMode(enabled) }\n    fun setWifiOnly(enabled: Boolean) = viewModelScope.launch { settings.setWifiOnlyDownloads(enabled) }\n    fun setPrefetch(enabled: Boolean) = viewModelScope.launch { settings.setPrefetchEnabled(enabled) }\n    fun setPrefetchOnMetered(enabled: Boolean) = viewModelScope.launch { settings.setPrefetchOnMetered(enabled) }\n}\n''')

          # Playback policy changes must not rebuild the Media3 playlist/current item.
          pc = 'app/src/main/java/dev/behradhz/meowzix/playback/AndroidPlaybackController.kt'
          old_start = '''    override fun setPlaybackMode(mode: PlaybackMode) {\n        scope.launch {\n            val tracks = runCatching { catalog.availableTracks() }'''
          start = Path(pc).read_text().find(old_start)
          end_marker = '''    override fun resume() = withController { connected ->'''
          end = Path(pc).read_text().find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('could not locate playback policy block')
          text = Path(pc).read_text()
          replacement = '''    override fun setPlaybackMode(mode: PlaybackMode) {\n        scope.launch {\n            val connected = runCatching { controller ?: controllerFuture.await().also { controller = it } }\n                .getOrElse { error ->\n                    showError(error.message ?: "Playback is unavailable")\n                    return@launch\n                }\n            if (connected.mediaItemCount == 0) return@launch\n            val repeatMode = connected.queueRepeatMode()\n            val currentIndex = connected.currentMediaItemIndex.coerceAtLeast(0)\n            val currentId = connected.currentMediaItem?.mediaId\n            val existingIds = (0 until connected.mediaItemCount).map { connected.getMediaItemAt(it).mediaId }\n            val desiredFutureIds = when (mode) {\n                PlaybackMode.ORDERED -> {\n                    val order = runCatching { catalog.availableTracks().map { it.id.toString() } }.getOrDefault(emptyList())\n                    val rank = order.withIndex().associate { it.value to it.index }\n                    existingIds.drop(currentIndex + 1).sortedBy { rank[it] ?: Int.MAX_VALUE }\n                }\n                PlaybackMode.PURE_SHUFFLE -> existingIds.drop(currentIndex + 1).shuffled()\n                PlaybackMode.SMART_SHUFFLE -> {\n                    val allowed = existingIds.mapNotNull { runCatching { UUID.fromString(it) }.getOrNull() }\n                    recommendationEngine.generate(\n                        allowedTrackIds = allowed,\n                        currentTrackId = currentId?.let { runCatching { UUID.fromString(it) }.getOrNull() },\n                        timeBucket = currentTimeBucket(),\n                    ).trackIds.map(UUID::toString).filterNot { it == currentId }\n                }\n            }\n            desiredFutureIds.forEachIndexed { offset, mediaId ->\n                val destination = currentIndex + 1 + offset\n                val sourceIndex = (destination until connected.mediaItemCount)\n                    .firstOrNull { connected.getMediaItemAt(it).mediaId == mediaId }\n                    ?: return@forEachIndexed\n                if (sourceIndex != destination) connected.moveMediaItem(sourceIndex, destination)\n            }\n            updateQueuePolicyMetadata(connected, mode, repeatMode)\n        }\n    }\n\n    override fun setRepeatMode(mode: RepeatMode) = withController { connected ->\n        val playbackMode = connected.queuePlaybackMode()\n        connected.repeatMode = mode.toPlayerRepeatMode(playbackMode)\n        updateQueuePolicyMetadata(connected, playbackMode, mode)\n    }\n\n'''
          Path(pc).write_text(text[:start] + replacement + text[end:])
          patch(pc, '''private fun replaceQueuePolicy(player: MediaController, playbackMode: PlaybackMode, repeatMode: RepeatMode) {\n    if (player.mediaItemCount == 0) return\n    val currentIndex = player.currentMediaItemIndex.coerceAtLeast(0)\n    val position = player.currentPosition.coerceAtLeast(0)\n    val wasPlaying = player.isPlaying\n    val items = (0 until player.mediaItemCount)\n        .map { index -> player.getMediaItemAt(index).withQueuePolicy(playbackMode, repeatMode) }\n    player.setMediaItems(items, currentIndex.coerceIn(items.indices), position)\n    player.prepare()\n    if (wasPlaying) player.play()\n}''', '''private fun updateQueuePolicyMetadata(player: MediaController, playbackMode: PlaybackMode, repeatMode: RepeatMode) {\n    for (index in 0 until player.mediaItemCount) {\n        val current = player.getMediaItemAt(index)\n        player.replaceMediaItem(index, current.withQueuePolicy(playbackMode, repeatMode))\n    }\n}''')

          # Manifest will use an adaptive launcher icon resource. The vector placeholder is safe to replace later.
          manifest = 'app/src/main/AndroidManifest.xml'
          patch(manifest, '''        android:allowBackup="true"\n        android:label="Meowzix"''', '''        android:allowBackup="true"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n        android:label="Meowzix"''')
          write('app/src/main/res/values/ic_launcher_background.xml', '''<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#1B1715</color></resources>\n''')
          write('app/src/main/res/drawable/ic_launcher_foreground.xml', '''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">\n    <path android:fillColor="#FFB38A" android:pathData="M36,31 L36,70 C36,80 28,85 20,82 C12,79 11,68 18,63 C22,60 27,60 31,61 L31,37 L77,29 L77,63 C77,73 69,78 61,75 C53,72 52,61 59,56 C63,53 68,53 72,54 L72,36 Z"/>\n</vector>\n''')
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n'''
          write('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', adaptive)
          write('app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml', adaptive)
          # Legacy fallback points at the vector foreground so minSdk 26 always resolves the resource.
          write('app/src/main/res/mipmap-anydpi/ic_launcher.xml', '''<?xml version="1.0" encoding="utf-8"?>\n<selector xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@drawable/ic_launcher_foreground"/></selector>\n''')
