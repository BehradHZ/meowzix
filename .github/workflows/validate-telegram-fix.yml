name: Validate Telegram regression fix

on:
  push:
    branches:
      - feat/telegram-library-ux
    paths:
      - .github/workflows/validate-telegram-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/telegram-library-ux
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests, lint, and debug build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Clean validation workflow
        if: always()
        run: |
          rm -f .github/workflows/validate-telegram-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean Telegram validation workflow" || true
          git push origin HEAD:feat/telegram-library-ux
