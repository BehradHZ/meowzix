name: Apply library swipe and track gestures
on:
  push:
    branches: [feat/telegram-library-ux]
    paths: [.github/workflows/apply-library-gestures.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/telegram-library-ux
      - name: Apply
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new, count=1):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'pattern missing: {path}: {old[:120]!r}')
              p.write_text(t.replace(old,new,count))
          def write(path, content):
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(content)

          write('app/src/main/java/dev/behradhz/meowzix/navigation/HorizontalSwipeNavigation.kt','''package dev.behradhz.meowzix.navigation\n\nimport androidx.compose.foundation.gestures.awaitEachGesture\nimport androidx.compose.foundation.gestures.awaitFirstDown\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.pointerInput\nimport androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.unit.dp\nimport kotlin.math.abs\n\nfun Modifier.horizontalSwipeNavigation(\n    enabled: Boolean = true,\n    onSwipeLeft: () -> Unit,\n    onSwipeRight: () -> Unit,\n): Modifier = if (!enabled) this else pointerInput(onSwipeLeft, onSwipeRight) {\n    val threshold = 72.dp.toPx()\n    awaitEachGesture {\n        val down = awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Final)\n        var totalX = 0f\n        var blockedByChild = down.isConsumed\n        while (true) {\n            val event = awaitPointerEvent(PointerEventPass.Final)\n            val change = event.changes.firstOrNull { it.id == down.id } ?: break\n            if (change.isConsumed) blockedByChild = true\n            if (!blockedByChild) totalX += change.positionChange().x\n            if (!change.pressed) break\n        }\n        if (!blockedByChild && abs(totalX) >= threshold) {\n            if (totalX < 0f) onSwipeLeft() else onSwipeRight()\n        }\n    }\n}\n''')

          app='app/src/main/java/dev/behradhz/meowzix/navigation/MeowzixApp.kt'
          patch(app,'''            modifier = Modifier\n                .fillMaxSize()\n                .hazeSource(hazeState),''','''            modifier = Modifier\n                .fillMaxSize()\n                .horizontalSwipeNavigation(\n                    enabled = isTopLevelDestination && currentRoute != LIBRARY_ROUTE,\n                    onSwipeLeft = {\n                        val index = destinations.indexOfFirst { it.route == currentRoute }\n                        if (index in 0 until destinations.lastIndex) {\n                            navController.navigate(destinations[index + 1].route) {\n                                popUpTo(navController.graph.findStartDestination().id) { saveState = true }\n                                launchSingleTop = true\n                                restoreState = true\n                            }\n                        }\n                    },\n                    onSwipeRight = {\n                        val index = destinations.indexOfFirst { it.route == currentRoute }\n                        if (index > 0) {\n                            navController.navigate(destinations[index - 1].route) {\n                                popUpTo(navController.graph.findStartDestination().id) { saveState = true }\n                                launchSingleTop = true\n                                restoreState = true\n                            }\n                        }\n                    },\n                )\n                .hazeSource(hazeState),''')
          patch(app,'''                LibraryRoute(\n                    onOpenNowPlaying = {''','''                LibraryRoute(\n                    onSwipePastEnd = {\n                        navController.navigate(QUEUE_ROUTE) {\n                            popUpTo(navController.graph.findStartDestination().id) { saveState = true }\n                            launchSingleTop = true\n                            restoreState = true\n                        }\n                    },\n                    onOpenNowPlaying = {''')

          lib='app/src/main/java/dev/behradhz/meowzix/feature/library/LibraryRoute.kt'
          patch(lib,'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.clickable','import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.ExperimentalFoundationApi\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.combinedClickable')
          patch(lib,'import dev.behradhz.meowzix.domain.library.LibraryTrackAvailability','import dev.behradhz.meowzix.domain.downloads.OfflineDownload\nimport dev.behradhz.meowzix.domain.library.LibraryTrackAvailability')
          patch(lib,'import dev.behradhz.meowzix.ui.components.TrackArtwork','import dev.behradhz.meowzix.navigation.horizontalSwipeNavigation\nimport dev.behradhz.meowzix.ui.components.ChatAvatar\nimport dev.behradhz.meowzix.ui.components.DownloadableTrackArtwork\nimport dev.behradhz.meowzix.ui.components.TrackArtwork')
          patch(lib,'''fun LibraryRoute(\n    onOpenNowPlaying: () -> Unit,''','''fun LibraryRoute(\n    onSwipePastEnd: () -> Unit = {},\n    onOpenNowPlaying: () -> Unit,''')
          patch(lib,'''        onOpenTelegram = onOpenTelegram,\n    )''','''        onOpenTelegram = onOpenTelegram,\n        onSwipePastEnd = onSwipePastEnd,\n    )''')
          patch(lib,'''    onSaveQueue: () -> Unit,\n    onOpenTelegram: () -> Unit,\n) {''','''    onSaveQueue: () -> Unit,\n    onOpenTelegram: () -> Unit,\n    onSwipePastEnd: () -> Unit,\n) {''')
          patch(lib,'''        modifier = Modifier\n            .fillMaxSize()\n            .statusBarsPadding(),''','''        modifier = Modifier\n            .fillMaxSize()\n            .horizontalSwipeNavigation(\n                enabled = selectedArtist == null && selectedAlbumName == null,\n                onSwipeLeft = {\n                    if (selectedSectionIndex < LibrarySection.entries.lastIndex) selectedSectionIndex++\n                    else onSwipePastEnd()\n                },\n                onSwipeRight = { if (selectedSectionIndex > 0) selectedSectionIndex-- },\n            )\n            .statusBarsPadding(),''')
          # Every TracksSection receives live download state.
          t=Path(lib).read_text()
          t=t.replace('''                availability = state.availability,\n                playlists = state.playlists,''','''                availability = state.availability,\n                downloads = state.downloads,\n                playlists = state.playlists,''')
          t=t.replace('''                    availability = state.availability,\n                    playlists = state.playlists,''','''                    availability = state.availability,\n                    downloads = state.downloads,\n                    playlists = state.playlists,''')
          Path(lib).write_text(t)
          patch(lib,'''    availability: Map<UUID, LibraryTrackAvailability>,\n    playlists: List<PlaylistSummary>,''','''    availability: Map<UUID, LibraryTrackAvailability>,\n    downloads: Map<UUID, OfflineDownload>,\n    playlists: List<PlaylistSummary>,''')
          patch(lib,'''                availability = availability[track.id] ?: LibraryTrackAvailability.UNAVAILABLE,\n                playlists = playlists,''','''                availability = availability[track.id] ?: LibraryTrackAvailability.UNAVAILABLE,\n                download = downloads[track.id],\n                playlists = playlists,''')
          patch(lib,'''    availability: LibraryTrackAvailability,\n    playlists: List<PlaylistSummary>,''','''    availability: LibraryTrackAvailability,\n    download: OfflineDownload?,\n    playlists: List<PlaylistSummary>,''')
          patch(lib,'''    val dismissState = rememberSwipeToDismissBoxState(\n        confirmValueChange = { value ->''','''    val dismissState = rememberSwipeToDismissBoxState(\n        positionalThreshold = { distance -> distance * 0.22f },\n        confirmValueChange = { value ->''')
          patch(lib,'''            availability = availability,\n            playlists = playlists,''','''            availability = availability,\n            download = download,\n            playlists = playlists,''')
          # second availability signature belongs to TrackRow.
          patch(lib,'''    availability: LibraryTrackAvailability,\n    playlists: List<PlaylistSummary>,\n    onFavorite: () -> Unit,''','''    availability: LibraryTrackAvailability,\n    download: OfflineDownload?,\n    playlists: List<PlaylistSummary>,\n    onFavorite: () -> Unit,''')
          patch(lib,'@Composable\nprivate fun TrackRow(','@OptIn(ExperimentalFoundationApi::class)\n@Composable\nprivate fun TrackRow(')
          patch(lib,'''        modifier = Modifier\n            .fillMaxWidth()\n            .clickable(onClick = onClick),''','''        modifier = Modifier\n            .fillMaxWidth()\n            .combinedClickable(onClick = onClick, onLongClick = { menuExpanded = true }),''')
          patch(lib,'            TrackArtwork(track.artworkRef, track.title, size = 52.dp)','''            DownloadableTrackArtwork(\n                artworkRef = track.artworkRef,\n                description = track.title,\n                size = 52.dp,\n                isOffline = availability == LibraryTrackAvailability.OFFLINE,\n                download = download,\n                onDownload = onPinOffline,\n            )''')
          # Give the foreground card its own surface/elevation over the revealed action card.
          patch(lib,'''        color = if (isCurrent) MaterialTheme.colorScheme.primary.copy(alpha = 0.10f) else Color.Transparent,\n    ) {''','''        color = if (isCurrent) MaterialTheme.colorScheme.primary.copy(alpha = 0.10f) else MaterialTheme.colorScheme.surface,\n        shadowElevation = 1.dp,\n    ) {''')
          # Reorder long-press/overflow menu and remove redundant Pin Offline entry (download is on artwork).
          p=Path(lib); t=p.read_text()
          start=t.find('''                    DropdownMenuItem(\n                        text = { Text("Play next") },''')
          end=t.find('''                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun ArtistsSection''',start)
          if start<0 or end<0: raise SystemExit('Track action menu boundaries missing')
          menu='''                    DropdownMenuItem(\n                        text = { Text("Add to queue") },\n                        leadingIcon = { Icon(Icons.Rounded.PlaylistAdd, contentDescription = null) },\n                        onClick = { menuExpanded = false; onAddToQueue() },\n                    )\n                    DropdownMenuItem(\n                        text = { Text("Play next") },\n                        leadingIcon = { Icon(Icons.Rounded.PlaylistPlay, contentDescription = null) },\n                        onClick = { menuExpanded = false; onPlayNext() },\n                    )\n                    playlists.forEach { playlist ->\n                        DropdownMenuItem(\n                            text = { Text("Add to playlist · ${playlist.title}") },\n                            leadingIcon = { Icon(Icons.Rounded.PlaylistAddCircle, contentDescription = null) },\n                            onClick = { menuExpanded = false; onAddToPlaylist(playlist.id) },\n                        )\n                    }\n                    DropdownMenuItem(\n                        text = { Text(if (track.favorite) "Remove favorite" else "Favorite") },\n                        leadingIcon = { Icon(if (track.favorite) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder, contentDescription = null) },\n                        onClick = { menuExpanded = false; onFavorite() },\n                    )\n'''
          p.write_text(t[:start]+menu+t[end:])

          # Telegram-generated playlists show their source avatar.
          patch(lib,'''                LibrarySection.PLAYLISTS -> PlaylistsSection(\n                    playlists = state.playlists,''','''                LibrarySection.PLAYLISTS -> PlaylistsSection(\n                    playlists = state.playlists,\n                    playlistArtwork = state.playlistArtwork,''')
          patch(lib,'''private fun PlaylistsSection(\n    playlists: List<PlaylistSummary>,''','''private fun PlaylistsSection(\n    playlists: List<PlaylistSummary>,\n    playlistArtwork: Map<UUID, String?>,''')
          patch(lib,'''            ) {\n                Text("${playlist.title} · ${trackCountLabel(playlist.trackCount)}", modifier = Modifier.padding(12.dp))\n            }''','''            ) {\n                Row(modifier = Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {\n                    ChatAvatar(playlistArtwork[playlist.id], playlist.title, size = 46.dp)\n                    Column(Modifier.padding(start = 12.dp)) {\n                        Text(playlist.title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)\n                        Text(trackCountLabel(playlist.trackCount), style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.56f))\n                    }\n                }\n            }''')

          Path('.github/workflows/apply-library-gestures.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(library): add swipe navigation and Spotify-like track actions"
          git push origin HEAD:feat/telegram-library-ux
